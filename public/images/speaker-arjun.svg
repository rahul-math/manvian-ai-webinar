<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="speakerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16233B"/>
      <stop offset="50%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#speakerBg)"/>
  <circle cx="300" cy="280" r="160" fill="url(#accentGlow)"/>

  <!-- Stylized Executive Speaker Silhouette / Graphic -->
  <!-- Shoulders & Suit Jacket -->
  <path d="M 120 750 C 130 540, 200 480, 240 450 L 360 450 C 400 480, 470 540, 480 750 Z" fill="#1E2D4A"/>
  <!-- Lapels -->
  <polygon points="270,450 300,560 330,450" fill="#0B1220"/>
  <!-- Shirt -->
  <polygon points="285,450 300,510 315,450" fill="#E2E8F0"/>
  <!-- Tie -->
  <polygon points="296,480 304,480 306,580 300,595 294,580" fill="#10B981"/>

  <!-- Neck -->
  <rect x="275" y="380" width="50" height="80" rx="8" fill="#D4A373"/>

  <!-- Head -->
  <ellipse cx="300" cy="310" rx="85" ry="105" fill="#E2B184"/>

  <!-- Hair -->
  <path d="M 205 290 C 205 180, 395 180, 395 290 C 370 210, 230 210, 205 290 Z" fill="#1A202C"/>

  <!-- Modern Glasses Frame -->
  <rect x="235" y="290" width="55" height="32" rx="6" fill="none" stroke="#38BDF8" stroke-width="4"/>
  <rect x="310" y="290" width="55" height="32" rx="6" fill="none" stroke="#38BDF8" stroke-width="4"/>
  <line x1="290" y1="305" x2="310" y2="305" stroke="#38BDF8" stroke-width="4"/>

  <!-- Eyes behind glasses -->
  <circle cx="262" cy="306" r="5" fill="#2D3748"/>
  <circle cx="338" cy="306" r="5" fill="#2D3748"/>

  <!-- Friendly Confident Smile -->
  <path d="M 275 365 Q 300 380 325 365" fill="none" stroke="#8C5334" stroke-width="3" stroke-linecap="round"/>

  <!-- Clean Trim Beard -->
  <path d="M 225 310 C 235 410, 365 410, 375 310 C 350 390, 250 390, 225 310 Z" fill="#1A202C" fill-opacity="0.7"/>

  <!-- Tech Overlay Reticle -->
  <circle cx="300" cy="310" r="140" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 4"/>
  <line x1="160" y1="310" x2="440" y2="310" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Speaker Title Badge in graphic -->
  <rect x="150" y="660" width="300" height="60" rx="14" fill="#0B1220" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
  <text x="300" y="688" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Arjun Mehta</text>
  <text x="300" y="708" fill="#38BDF8" font-family="monospace" font-size="11" text-anchor="middle">Industrial AI &amp; Automation Consultant</text>
</svg>
